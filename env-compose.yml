services:
  alexandria-app-base:
    image: heterarchy-alexandria-app:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - ALEXANDRIA_BUILD_REVISION
        - ALEXANDRIA_BUILD_TIMESTAMP
    env_file:
      - ./.env
      - ./runtime-performance.env
    environment:
      PYTHONUNBUFFERED: "1"
      SERVICE_ALEXANDRIA_OBSIDIAN_ROOT: "."
      SERVICE_MEMORY_COMPACT_NOTE_DIR: "Memory Compacts"
      SERVICE_OBSIDIAN_VAULT_PATH: /vault
    init: true
    volumes:
      - ./backend/data:/app/data
      - embedding-model-cache:/app/cache/embeddings
      - ${ALEXANDRIA_HOST_OBSIDIAN_VAULT_PATH}:/vault
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - alexandria-network
