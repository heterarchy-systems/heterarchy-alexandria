services:
  alexandria-app-base:
    image: heterarchy-alexandria-app:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
      - ./runtime-performance.env
    environment:
      PYTHONUNBUFFERED: "1"
      SERVICE_ALEXANDRIA_OBSIDIAN_ROOT: "."
      SERVICE_MEMORY_COMPACT_NOTE_DIR: "Memory Compacts"
      SERVICE_OBSIDIAN_VAULT_PATH: /vault
    init: true
    volumes:
      - ./backend/pyproject.toml:/app/pyproject.toml:ro
      - ./backend/uv.lock:/app/uv.lock:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./backend/app:/app/app:ro
      - ./backend/migrations:/app/migrations:ro
      - ./backend/data:/app/data
      - embedding-model-cache:/app/cache/embeddings
      - ${ALEXANDRIA_HOST_OBSIDIAN_VAULT_PATH}:/vault
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - alexandria-network
