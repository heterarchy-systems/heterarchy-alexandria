[workspace]
members = [
    "crates/heterarchy-alexandria-core",
    "crates/heterarchy-alexandria-py",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
fastembed = { version = "5.17.4", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
pyo3 = { version = "0.29.2", default-features = false, features = ["macros"] }
pyo3-build-config = "0.29.2"
caseless = "0.2"
fancy-regex = "0.16"
petgraph = { version = "0.8", default-features = false, features = ["std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
unicode-normalization = "0.1.25"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
