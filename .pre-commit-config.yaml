minimum_pre_commit_version: "3.5.0"
default_install_hook_types:
  - pre-push

repos:
  - repo: local
    hooks:
      - id: repository-quality-gate
        name: repository quality gate
        entry: bash -lc 'unset VIRTUAL_ENV; cd backend && uv sync --group dev --reinstall-package heterarchy-alexandria && cd .. && make ci'
        language: system
        pass_filenames: false
        stages: [pre-push]
