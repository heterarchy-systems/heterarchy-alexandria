name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "native/**"
      - ".cargo/**"
      - ".agents/python_dev_harness/**"
      - ".agents/rust_dev_harness/**"
      - "Makefile"
      - "docker-compose.yml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "native/**"
      - ".cargo/**"
      - ".agents/python_dev_harness/**"
      - ".agents/rust_dev_harness/**"
      - "Makefile"
      - "docker-compose.yml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Repository quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --group dev --reinstall-package heterarchy-alexandria

      - name: Run repository parity gate
        run: make ci
