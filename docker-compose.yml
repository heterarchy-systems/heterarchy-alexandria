services:
  alexandria-backend:
    extends:
      file: ./env-compose.yml
      service: alexandria-app-base
    container_name: alexandria-backend
    command: >
      sh -c "/app/.venv/bin/alembic upgrade head && exec /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      alexandria-postgres:
        condition: service_healthy
      alexandria-redis:
        condition: service_healthy

  # Reindexing is CPU-heavy and retryable. A dedicated process keeps bounded
  # embedding work and Redis Streams retries outside HTTP/MCP request handling.
  alexandria-maintenance-worker:
    extends:
      file: ./env-compose.yml
      service: alexandria-app-base
    container_name: alexandria-maintenance-worker
    command:
      - /app/.venv/bin/python
      - -m
      - app.operations.workers.redis_maintenance_worker
    depends_on:
      alexandria-backend:
        condition: service_healthy
      alexandria-redis:
        condition: service_healthy

  alexandria-postgres:
    container_name: alexandria-postgres
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: "${ALEXANDRIA_POSTGRES_DB}"
      POSTGRES_USER: "${ALEXANDRIA_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${ALEXANDRIA_POSTGRES_PASSWORD}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      alexandria-network:
        aliases:
          - postgres

  alexandria-redis:
    container_name: alexandria-redis
    image: redis:8.8.1-alpine
    env_file:
      - ./runtime-performance.env
    entrypoint: ["/bin/sh", "/usr/local/bin/alexandria-redis-start.sh"]
    volumes:
      - ./scripts/redis-start.sh:/usr/local/bin/alexandria-redis-start.sh:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - alexandria-network

volumes:
  embedding-model-cache:
    name: heterarchy-alexandria_embedding-model-cache-v2
  postgres-data:
  redis-data:

networks:
  alexandria-network:
    driver: bridge
